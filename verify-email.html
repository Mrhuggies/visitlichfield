<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon { font-size: 64px; margin-bottom: 24px; }
        h1 { font-size: 28px; color: #1F2937; margin-bottom: 16px; }
        p { color: #6B7280; font-size: 16px; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 16px;
        }
        .error { background: #FEE2E2; color: #991B1B; padding: 16px; border-radius: 8px; }
        .loading { color: #6B7280; }
    </style>
</head>
<body>
    <div class="card">
        <div id="content">
            <div class="loading">
                <div class="icon">⏳</div>
                <h1>Verifying...</h1>
                <p>Please wait while we verify your email address.</p>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'https://apps.tag-art.co.uk/visitlichfield/api';
        
        async function verifyEmail() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showError('Invalid verification link');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/verify-email.php?token=${token}`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('content').innerHTML = `
                        <div class="icon">✅</div>
                        <h1>Email Verified!</h1>
                        <p>Your account has been verified successfully.</p>
                        <p><strong>${data.name}</strong>, you can now log in to your driver dashboard.</p>
                        <a href="driver-login.html" class="btn">Go to Login</a>
                    `;
                } else {
                    showError(data.error || 'Verification failed');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            }
        }
        
        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="icon">❌</div>
                <h1>Verification Failed</h1>
                <div class="error">${message}</div>
                <a href="driver-login.html" class="btn">Back to Login</a>
            `;
        }
        
        verifyEmail();
    </script>
</body>
</html>
