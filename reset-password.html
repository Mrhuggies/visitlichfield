<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Driver Password - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1F2937;
            text-align: center;
        }
        
        .subtitle {
            color: #6B7280;
            margin-bottom: 32px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .success {
            background: #D1FAE5;
            color: #065F46;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error {
            background: #FEE2E2;
            color: #991B1B;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .admin-notice {
            background: #FEF3C7;
            color: #92400E;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reset Driver Password</h1>
        <p class="subtitle">Admin tool to reset driver passwords</p>
        
        <div class="admin-notice" id="adminNotice">
            ⚠️ You must be logged in as admin to use this tool
        </div>
        
        <div class="success" id="successMsg"></div>
        <div class="error" id="errorMsg"></div>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="email">Driver Email *</label>
                <input type="email" id="email" required placeholder="driver@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">New Password *</label>
                <input type="password" id="password" required minlength="8">
                <small style="color: #6B7280;">Minimum 8 characters</small>
            </div>
            
            <button type="submit" class="btn" id="submitBtn">
                Reset Password
            </button>
        </form>
        
        <p style="margin-top: 20px; text-align: center;">
            <a href="admin/dashboard.html" style="color: #667eea; text-decoration: none;">
                ← Back to Admin Dashboard
            </a>
        </p>
    </div>
    
    <script>
        const API_BASE = 'https://apps.tag-art.co.uk/visitlichfield/api';
        const adminToken = localStorage.getItem('adminToken');
        
        // Check if admin is logged in
        if (!adminToken) {
            document.getElementById('adminNotice').innerHTML = '❌ Not logged in as admin. <a href="admin/login.html" style="color: #92400E;">Login here</a>';
            document.getElementById('submitBtn').disabled = true;
        } else {
            document.getElementById('adminNotice').innerHTML = '✅ Logged in as admin';
            document.getElementById('adminNotice').style.background = '#D1FAE5';
            document.getElementById('adminNotice').style.color = '#065F46';
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!adminToken) {
                alert('You must be logged in as admin to reset passwords');
                return;
            }
            
            const btn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');
            
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Resetting...';
            
            try {
                const response = await fetch(`${API_BASE}/admin/reset-driver-password.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        admin_token: adminToken,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok || data.error) {
                    throw new Error(data.error || 'Failed to reset password');
                }
                
                successMsg.textContent = `✅ Password reset successfully for ${data.driver_name || data.driver_email}`;
                successMsg.style.display = 'block';
                document.getElementById('resetForm').reset();
                
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
